name: Build VerdGram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529" --sdk_root=$ANDROID_SDK_ROOT

      - name: Set up keystore
        run: |
          rm -f TMessagesProj/config/release.keystore
          keytool -genkey -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias verdgram \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass verdgram123 \
            -keypass verdgram123 \
            -dname "CN=VerdGram, OU=VerdGram, O=VerdGram, L=Unknown, S=Unknown, C=US"

      - name: Set gradle properties
        run: |
          echo "RELEASE_KEY_PASSWORD=verdgram123" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=verdgram" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=verdgram123" >> gradle.properties

      - name: Create google-services.json
        run: |
          cat > TMessagesProj/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "verdgram-app",
              "storage_bucket": "verdgram-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "org.verdgram.messenger"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy_Key_For_VerdGram_Build_Only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:fedcba0987654321",
                  "android_client_info": {
                    "package_name": "org.telegram.messenger"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy_Key_For_VerdGram_Build_Only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build APK
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Find APK
        run: find . -name "*.apk" | grep -v "test\|Test" | tee /tmp/apk_paths.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerdGram-APK
          path: |
            TMessagesProj/build/outputs/apk/afat/release/*.apk
            TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: warn
          retention-days: 30
